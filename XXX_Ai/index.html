<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XXX_Ai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ЛІВА ПАНЕЛЬ -->
    <aside class="sidebar">

        <!-- ЛОГОТИП -->
        <div class="logo-area">

            <div class="logo-box">
                X
            </div>

            <div class="logo-text">

                <div class="logo-title">
                    XXX_Ai
                </div>

                <div class="logo-subtitle">
                    Personal AI
                </div>

            </div>

        </div>


        <!-- НЕОНОВА ЛІНІЯ ПІД ЛОГО -->
        <div class="sidebar-neon-line"></div>


        <!-- НАЛАШТУВАННЯ -->
        <button class="settings-button">
            <span>⚙</span>
            <span>Налаштування</span>
        </button>


        <!-- ЧАТИ -->
        <section class="chats-panel">

            <div class="chats-top">

                <span class="section-title">
                    All Chats
                </span>

                <button id="toggleChats" class="toggle-button">
                    ▲
                </button>

            </div>


            <button id="newChatButton" class="new-chat-button">
                New Chat +
            </button>


            <div id="chatList" class="chat-list">

                <button class="chat-item active">
                    Новий чат
                </button>

            </div>

        </section>


        <!-- АККАУНТ -->
        <div class="account-area">

            <div class="account-divider"></div>

            <div class="account-block">

                <div class="avatar">
                    ?
                </div>

                <div class="account-info">

                    <div class="account-name">
                        Мій акаунт
                    </div>

                    <div class="account-plan">
                        FREE
                    </div>

                </div>

                <button class="account-more">
                    ⋮
                </button>

            </div>


            <button class="new-account-button">
                + Новий акаунт
            </button>

        </div>

    </aside>


    <!-- ЦЕНТРАЛЬНА НЕОНОВА ЛІНІЯ -->
    <div class="neon-divider"></div>


    <!-- ПРАВА ЧАСТИНА -->
    <main class="main">

        <!-- ВЕРХ ЧАТУ -->
        <header class="chat-header">

            <div class="chat-title-area">

                <div class="chat-title">
                    Новий чат
                </div>

                <div class="chat-version">
                    XXX_Ai v0.1
                </div>

            </div>

        </header>


        <!-- ПОВІДОМЛЕННЯ -->
        <section id="chat" class="messages">

            <div class="message ai-message">

                <div class="message-author">
                    XXX_Ai
                </div>

                <div class="message-content">
                    Привіт! Я XXX_Ai. Чим можу допомогти?
                </div>

                <div class="message-time">
                    00:00
                </div>

            </div>

        </section>


        <!-- ПОЛЕ ВВОДУ -->
        <footer class="input-area">

            <div class="input-wrapper">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Запитайте у XXX"
                    autocomplete="off"
                >

                <button id="sendButton" class="send-button">
                    ➤
                </button>

            </div>

            <div class="bottom-text">
                XXX_Ai v0.1 • Перша версія прототипу
            </div>

        </footer>

    </main>

</div>


<script type="module" src="ALL AI.js/Ai Core.js"></script>
<script type="module" src="ALL AI.js/main.js"></script>
<script type="module" src="ALL AI.js/storage.js"></script>
<script type="module" src="ALL AI.js/UI.js"></script>
<div id="chatContextMenu" class="context-menu">

    <button id="renameChatButton">
        Rename Chat
    </button>

    <button id="deleteChatButton">
        Delete Chat
    </button>

</div>

</body>
</html>
